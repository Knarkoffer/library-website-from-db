<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{% endblock %} · {{ library_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/mine.css') }}">
</head>
<body id="top">
  {% include 'menu.html' %}
  <main class="report">
    <header><h1>{{ self.title() }}</h1>{% block controls %}{% endblock %}</header>
    {% block content %}{% endblock %}
    <footer><a href="#top">Back to top ↑</a></footer>
  </main>
</body>
</html>
